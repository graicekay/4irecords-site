<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <!-- Shot visualizer: a lens with its aperture blades, a focal-length scale,
       and the viewfinder framing a flat figure on thirds. 4i green on ink. -->
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="7" cy="7" r="2.6" fill="#57FF52"/>
    </pattern>
    <pattern id="dotsFine" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4.5" cy="4.5" r="1.5" fill="#F0F0F0"/>
    </pattern>
    <radialGradient id="fade"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="glow"><rect width="1600" height="800" fill="url(#fade)"/></mask>
    <clipPath id="vf"><rect x="640" y="150" width="760" height="500"/></clipPath>
  </defs>

  <rect width="1600" height="800" fill="#0A0A0A"/>
  <ellipse cx="1020" cy="400" rx="640" ry="420" fill="url(#dots)" mask="url(#glow)"/>

  <!-- lens, face on -->
  <g transform="translate(330 400)">
    <circle r="250" fill="#141414" stroke="#F0F0F0" stroke-width="7"/>
    <circle r="250" fill="url(#dotsFine)" opacity=".14"/>
    <circle r="205" fill="none" stroke="#57FF52" stroke-width="16"/>
    <g stroke="#F0F0F0" stroke-width="4">
      <line x1="0" y1="-236" x2="0" y2="-218"/><line x1="118" y1="-204" x2="109" y2="-189"/>
      <line x1="204" y1="-118" x2="189" y2="-109"/><line x1="236" y1="0" x2="218" y2="0"/>
      <line x1="204" y1="118" x2="189" y2="109"/><line x1="118" y1="204" x2="109" y2="189"/>
      <line x1="0" y1="236" x2="0" y2="218"/><line x1="-118" y1="204" x2="-109" y2="189"/>
      <line x1="-204" y1="118" x2="-189" y2="109"/><line x1="-236" y1="0" x2="-218" y2="0"/>
      <line x1="-204" y1="-118" x2="-189" y2="-109"/><line x1="-118" y1="-204" x2="-109" y2="-189"/>
    </g>
    <circle r="175" fill="#050505"/>
    <!-- aperture blades -->
    <g fill="#1c1c1c" stroke="#2e2e2e" stroke-width="3">
      <path d="M 0 -175 L 70 -40 L -60 -60 Z"/><path d="M 151 -88 L 34 70 L 70 -40 Z"/>
      <path d="M 151 88 L -40 75 L 34 70 Z"/><path d="M 0 175 L -72 -10 L -40 75 Z"/>
      <path d="M -151 88 L -60 -60 L -72 -10 Z"/><path d="M -151 -88 L 70 -40 L -60 -60 Z"/>
    </g>
    <polygon points="70,-40 34,70 -40,75 -72,-10 -60,-60" fill="#57FF52"/>
    <polygon points="70,-40 34,70 -40,75 -72,-10 -60,-60" fill="url(#dotsFine)" opacity=".3"/>
    <path d="M -120 -110 A 165 165 0 0 1 40 -160" fill="none" stroke="#F0F0F0" stroke-width="9" stroke-linecap="round" opacity=".5"/>
  </g>

  <!-- focal lengths -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" fill="#F0F0F0">
    <text x="120" y="720" opacity=".45">24</text>
    <text x="220" y="720" opacity=".6">35</text>
    <text x="320" y="720" fill="#57FF52">50</text>
    <text x="420" y="720" opacity=".6">85</text>
  </g>
  <rect x="330" y="732" width="42" height="7" fill="#57FF52"/>

  <!-- viewfinder -->
  <rect x="640" y="150" width="760" height="500" fill="#141414"/>
  <g clip-path="url(#vf)">
    <rect x="640" y="150" width="760" height="500" fill="url(#dotsFine)" opacity=".1"/>
    <!-- horizon + a flat figure on the right third -->
    <rect x="640" y="520" width="760" height="130" fill="#1c1c1c"/>
    <g transform="translate(1147 300)">
      <circle cx="0" cy="0" r="46" fill="#F0F0F0"/>
      <path d="M -80 250 C -80 120, -50 70, 0 70 C 50 70, 80 120, 80 250 Z" fill="#F0F0F0"/>
      <path d="M 46 0 A 46 46 0 0 1 20 42 M 60 90 C 76 120, 80 180, 80 250" fill="none" stroke="#57FF52" stroke-width="9"/>
    </g>
  </g>
  <!-- thirds -->
  <g stroke="#F0F0F0" stroke-width="2" opacity=".35">
    <line x1="893" y1="150" x2="893" y2="650"/><line x1="1147" y1="150" x2="1147" y2="650"/>
    <line x1="640" y1="317" x2="1400" y2="317"/><line x1="640" y1="483" x2="1400" y2="483"/>
  </g>
  <!-- corner brackets -->
  <g fill="none" stroke="#F0F0F0" stroke-width="8" stroke-linecap="square">
    <path d="M 640 210 L 640 150 L 700 150"/><path d="M 1340 150 L 1400 150 L 1400 210"/>
    <path d="M 1400 590 L 1400 650 L 1340 650"/><path d="M 700 650 L 640 650 L 640 590"/>
  </g>
  <!-- rec + readout -->
  <circle cx="690" cy="190" r="11" fill="#57FF52"/>
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="24" fill="#F0F0F0">
    <text x="712" y="199">MCU</text>
    <text x="1240" y="630" opacity=".8">50mm f/2</text>
  </g>
  <!-- focus square on the face -->
  <rect x="1105" y="258" width="84" height="84" fill="none" stroke="#57FF52" stroke-width="5"/>

  <path d="M 1500 90 l 10 34 l 34 10 l -34 10 l -10 34 l -10 -34 l -34 -10 l 34 -10 z" fill="#57FF52"/>
</svg>
