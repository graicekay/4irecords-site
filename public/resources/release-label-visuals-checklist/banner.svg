<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <!-- Release Label Visuals Checklist: a record sliding out of its sleeve
       beside a four-week checklist. 4i green on ink, print-dot shading. -->
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="7" cy="7" r="2.6" fill="#57FF52"/>
    </pattern>
    <pattern id="dotsFine" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4.5" cy="4.5" r="1.5" fill="#F0F0F0"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="glow"><rect width="1600" height="800" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1600" height="800" fill="#0A0A0A"/>
  <circle cx="640" cy="410" r="430" fill="url(#dots)" mask="url(#glow)"/>

  <!-- sleeve -->
  <g transform="rotate(-7 470 420)">
    <rect x="200" y="150" width="540" height="540" fill="#141414" stroke="#F0F0F0" stroke-width="6"/>
    <rect x="200" y="150" width="540" height="540" fill="url(#dotsFine)" opacity=".18"/>
    <rect x="238" y="188" width="140" height="22" fill="#57FF52"/>
    <rect x="238" y="226" width="220" height="10" fill="#F0F0F0" opacity=".5"/>
    <rect x="238" y="246" width="160" height="10" fill="#F0F0F0" opacity=".5"/>
  </g>

  <!-- record -->
  <g transform="translate(780 420)">
    <circle r="285" fill="#050505" stroke="#F0F0F0" stroke-width="6"/>
    <g fill="none" stroke="#2c2c2c" stroke-width="2.5">
      <circle r="265"/><circle r="245"/><circle r="228"/><circle r="208"/>
      <circle r="190"/><circle r="170"/><circle r="152"/><circle r="134"/><circle r="116"/>
    </g>
    <path d="M -210 -150 A 258 258 0 0 1 60 -252" fill="none" stroke="#F0F0F0" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    <path d="M 150 200 A 250 250 0 0 1 -40 246" fill="none" stroke="#F0F0F0" stroke-width="6" stroke-linecap="round" opacity=".3"/>
    <circle r="96" fill="#57FF52"/>
    <circle r="96" fill="url(#dotsFine)" opacity=".25"/>
    <text x="0" y="-26" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="54" fill="#0A0A0A">4i</text>
    <circle r="12" fill="#0A0A0A"/>
  </g>

  <!-- checklist card -->
  <g transform="rotate(5 1270 410)">
    <rect x="1070" y="140" width="400" height="540" fill="#F0F0F0"/>
    <rect x="1190" y="118" width="160" height="46" fill="#57FF52" opacity=".85" transform="rotate(-4 1270 141)"/>
    <text x="1110" y="222" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="40" fill="#0A0A0A" letter-spacing="1">WEEK 1–4</text>
    <g stroke="#0A0A0A" stroke-width="5" fill="none">
      <rect x="1110" y="262" width="40" height="40"/>
      <rect x="1110" y="342" width="40" height="40"/>
      <rect x="1110" y="422" width="40" height="40"/>
      <rect x="1110" y="502" width="40" height="40"/>
      <rect x="1110" y="582" width="40" height="40"/>
    </g>
    <g stroke="#1FAE1A" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 1112 280 L 1128 298 L 1162 250"/>
      <path d="M 1112 360 L 1128 378 L 1162 330"/>
      <path d="M 1112 440 L 1128 458 L 1162 410"/>
    </g>
    <g fill="#0A0A0A">
      <rect x="1176" y="274" width="240" height="14"/>
      <rect x="1176" y="354" width="200" height="14"/>
      <rect x="1176" y="434" width="250" height="14"/>
      <rect x="1176" y="514" width="180" height="14" opacity=".45"/>
      <rect x="1176" y="594" width="220" height="14" opacity=".45"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#57FF52">
    <path d="M 1500 110 l 10 34 l 34 10 l -34 10 l -10 34 l -10 -34 l -34 -10 l 34 -10 z"/>
    <path d="M 150 640 l 7 24 l 24 7 l -24 7 l -7 24 l -7 -24 l -24 -7 l 24 -7 z"/>
  </g>
</svg>
