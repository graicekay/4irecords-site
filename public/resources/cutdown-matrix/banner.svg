<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <!-- The Cutdown Matrix: scissors cut one film strip into vertical phone
       frames for Reels, TikTok and Shorts. Warm pink on ink. -->
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="7" cy="7" r="2.6" fill="#FF5C87"/>
    </pattern>
    <pattern id="dotsFine" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4.5" cy="4.5" r="1.5" fill="#F0F0F0"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="glow"><rect width="1600" height="800" fill="url(#fade)"/></mask>
    <g id="frame">
      <rect width="150" height="96" fill="#1c1c1c"/>
      <rect width="150" height="96" fill="url(#dotsFine)" opacity=".35"/>
    </g>
  </defs>

  <rect width="1600" height="800" fill="#0A0A0A"/>
  <ellipse cx="560" cy="420" rx="560" ry="360" fill="url(#dots)" mask="url(#glow)"/>

  <!-- film strip, cut in the middle -->
  <g transform="rotate(-8 500 420)">
    <g>
      <rect x="-40" y="340" width="600" height="160" fill="#F0F0F0"/>
      <g fill="#0A0A0A">
        <rect x="-20" y="350" width="22" height="16"/><rect x="30" y="350" width="22" height="16"/><rect x="80" y="350" width="22" height="16"/><rect x="130" y="350" width="22" height="16"/><rect x="180" y="350" width="22" height="16"/><rect x="230" y="350" width="22" height="16"/><rect x="280" y="350" width="22" height="16"/><rect x="330" y="350" width="22" height="16"/><rect x="380" y="350" width="22" height="16"/><rect x="430" y="350" width="22" height="16"/><rect x="480" y="350" width="22" height="16"/>
        <rect x="-20" y="474" width="22" height="16"/><rect x="30" y="474" width="22" height="16"/><rect x="80" y="474" width="22" height="16"/><rect x="130" y="474" width="22" height="16"/><rect x="180" y="474" width="22" height="16"/><rect x="230" y="474" width="22" height="16"/><rect x="280" y="474" width="22" height="16"/><rect x="330" y="474" width="22" height="16"/><rect x="380" y="474" width="22" height="16"/><rect x="430" y="474" width="22" height="16"/><rect x="480" y="474" width="22" height="16"/>
      </g>
      <use href="#frame" x="0" y="372"/><use href="#frame" x="170" y="372"/><use href="#frame" x="340" y="372"/>
      <rect x="340" y="372" width="150" height="96" fill="#FF5C87" opacity=".8"/>
    </g>
    <!-- the cut line -->
    <line x1="560" y1="300" x2="560" y2="540" stroke="#FF5C87" stroke-width="5" stroke-dasharray="14 12"/>
  </g>

  <!-- scissors -->
  <g transform="translate(730 350) rotate(160)">
    <path d="M 0 -8 L 250 -46 L 260 -30 L 10 14 Z" fill="#F0F0F0"/>
    <path d="M 0 8 L 250 46 L 260 30 L 10 -14 Z" fill="#D9D9D9"/>
    <circle cx="0" cy="0" r="12" fill="#0A0A0A" stroke="#F0F0F0" stroke-width="5"/>
    <ellipse cx="-110" cy="-58" rx="70" ry="44" fill="none" stroke="#FF5C87" stroke-width="26"/>
    <ellipse cx="-110" cy="58" rx="70" ry="44" fill="none" stroke="#FF5C87" stroke-width="26"/>
    <path d="M -46 -38 L 0 -8 M -46 38 L 0 8" stroke="#FF5C87" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- the cuts, now vertical phones -->
  <g transform="rotate(6 1030 400)">
    <rect x="960" y="170" width="170" height="302" rx="22" fill="#141414" stroke="#F0F0F0" stroke-width="6"/>
    <rect x="976" y="200" width="138" height="242" fill="#FF5C87"/>
    <rect x="976" y="200" width="138" height="242" fill="url(#dotsFine)" opacity=".3"/>
    <path d="M 1030 290 L 1030 350 L 1080 320 Z" fill="#F0F0F0"/>
  </g>
  <g transform="rotate(-4 1240 450)">
    <rect x="1160" y="300" width="170" height="302" rx="22" fill="#141414" stroke="#F0F0F0" stroke-width="6"/>
    <rect x="1176" y="330" width="138" height="242" fill="#1c1c1c"/>
    <rect x="1176" y="330" width="138" height="242" fill="url(#dotsFine)" opacity=".35"/>
    <path d="M 1245 500 C 1205 470, 1205 430, 1230 430 C 1240 430, 1245 440, 1245 446 C 1245 440, 1250 430, 1260 430 C 1285 430, 1285 470, 1245 500 Z" fill="#FF5C87"/>
  </g>
  <g transform="rotate(9 1450 330)">
    <rect x="1370" y="130" width="170" height="302" rx="22" fill="#141414" stroke="#F0F0F0" stroke-width="6"/>
    <rect x="1386" y="160" width="138" height="242" fill="#F0F0F0"/>
    <rect x="1386" y="160" width="138" height="242" fill="url(#dots)" opacity=".7"/>
    <rect x="1400" y="360" width="80" height="12" fill="#0A0A0A"/>
    <rect x="1400" y="380" width="56" height="12" fill="#0A0A0A"/>
  </g>
  <!-- flying offcut -->
  <g transform="rotate(24 820 640)">
    <rect x="760" y="600" width="120" height="80" fill="#F0F0F0"/>
    <rect x="772" y="612" width="96" height="56" fill="#FF5C87" opacity=".8"/>
  </g>
</svg>
