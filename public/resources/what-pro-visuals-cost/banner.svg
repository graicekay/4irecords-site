<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <!-- What Pro Visuals Actually Cost: a cinema camera on sticks, a price tag,
       and the four budget tiers as rising bars. Orange on ink. -->
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="7" cy="7" r="2.6" fill="#FF922B"/>
    </pattern>
    <pattern id="dotsFine" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4.5" cy="4.5" r="1.5" fill="#F0F0F0"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="beamMask"><polygon points="360,300 1600,40 1600,800 360,420" fill="url(#beam)"/></mask>
  </defs>

  <rect width="1600" height="800" fill="#0A0A0A"/>
  <!-- light off the lens, in print dots -->
  <rect width="1600" height="800" fill="url(#dots)" mask="url(#beamMask)"/>

  <!-- tripod -->
  <g stroke="#F0F0F0" stroke-width="10" stroke-linecap="round">
    <line x1="560" y1="520" x2="400" y2="780"/>
    <line x1="560" y1="520" x2="560" y2="800"/>
    <line x1="560" y1="520" x2="720" y2="780"/>
  </g>
  <rect x="500" y="500" width="120" height="34" fill="#F0F0F0"/>

  <!-- camera -->
  <g>
    <rect x="410" y="300" width="330" height="200" rx="10" fill="#141414" stroke="#F0F0F0" stroke-width="7"/>
    <rect x="410" y="300" width="330" height="200" rx="10" fill="url(#dotsFine)" opacity=".15"/>
    <!-- top handle -->
    <path d="M 470 300 L 470 250 L 680 250 L 680 300" fill="none" stroke="#F0F0F0" stroke-width="10" stroke-linejoin="round"/>
    <!-- monitor -->
    <rect x="620" y="170" width="150" height="100" fill="#0A0A0A" stroke="#F0F0F0" stroke-width="6"/>
    <rect x="634" y="184" width="122" height="72" fill="#FF922B"/>
    <rect x="634" y="184" width="122" height="72" fill="url(#dotsFine)" opacity=".35"/>
    <!-- lens -->
    <rect x="300" y="330" width="120" height="140" fill="#141414" stroke="#F0F0F0" stroke-width="7"/>
    <rect x="316" y="330" width="16" height="140" fill="#FF922B"/>
    <rect x="352" y="330" width="10" height="140" fill="#F0F0F0" opacity=".4"/>
    <ellipse cx="300" cy="400" rx="26" ry="72" fill="#0A0A0A" stroke="#F0F0F0" stroke-width="7"/>
    <ellipse cx="296" cy="400" rx="12" ry="40" fill="#FF922B"/>
    <!-- record light, dials -->
    <circle cx="700" cy="340" r="12" fill="#FF922B"/>
    <circle cx="470" cy="440" r="26" fill="none" stroke="#F0F0F0" stroke-width="6"/>
    <circle cx="540" cy="440" r="26" fill="none" stroke="#F0F0F0" stroke-width="6"/>
    <rect x="600" y="425" width="110" height="10" fill="#F0F0F0" opacity=".5"/>
    <rect x="600" y="447" width="80" height="10" fill="#F0F0F0" opacity=".5"/>
  </g>

  <!-- four budget tiers -->
  <g transform="translate(930 640)">
    <rect x="0" y="-70" width="92" height="70" fill="#F0F0F0" opacity=".35"/>
    <rect x="120" y="-150" width="92" height="150" fill="#F0F0F0" opacity=".6"/>
    <rect x="240" y="-250" width="92" height="250" fill="#F0F0F0"/>
    <rect x="360" y="-380" width="92" height="380" fill="#FF922B"/>
    <rect x="360" y="-380" width="92" height="380" fill="url(#dotsFine)" opacity=".3"/>
    <line x1="-20" y1="0" x2="480" y2="0" stroke="#F0F0F0" stroke-width="6"/>
  </g>

  <!-- price tag -->
  <g transform="rotate(-14 1360 190)">
    <path d="M 1250 130 L 1440 130 L 1500 190 L 1440 250 L 1250 250 Z" fill="#FF922B"/>
    <circle cx="1446" cy="190" r="13" fill="#0A0A0A"/>
    <text x="1268" y="226" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="96" fill="#0A0A0A">$$</text>
  </g>
  <path d="M 1476 150 C 1520 90, 1560 120, 1590 60" fill="none" stroke="#F0F0F0" stroke-width="4"/>
</svg>
