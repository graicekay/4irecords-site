<svg xmlns="http://www.w3.org/2000/svg" viewBox="262 160 520 645" width="520" height="645">
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="7" cy="7" r="2.6" fill="#FF922B"/></pattern>
    <pattern id="dotsFine" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4.5" cy="4.5" r="1.5" fill="#F0F0F0"/></pattern>
    <pattern id="dotsInk" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="5.5" cy="5.5" r="1.8" fill="#0A0A0A"/></pattern>
  </defs>
  <!-- tripod -->
  <g stroke="#F0F0F0" stroke-width="10" stroke-linecap="round">
    <line x1="560" y1="520" x2="400" y2="780"/>
    <line x1="560" y1="520" x2="560" y2="800"/>
    <line x1="560" y1="520" x2="720" y2="780"/>
  </g>
  <rect x="500" y="500" width="120" height="34" fill="#F0F0F0"/>

  <!-- camera -->
  <g>
    <rect x="410" y="300" width="330" height="200" rx="10" fill="#141414" stroke="#F0F0F0" stroke-width="7"/>
    <rect x="410" y="300" width="330" height="200" rx="10" fill="url(#dotsFine)" opacity=".15"/>
    <!-- top handle -->
    <path d="M 470 300 L 470 250 L 680 250 L 680 300" fill="none" stroke="#F0F0F0" stroke-width="10" stroke-linejoin="round"/>
    <!-- monitor -->
    <rect x="620" y="170" width="150" height="100" fill="#0A0A0A" stroke="#F0F0F0" stroke-width="6"/>
    <rect x="634" y="184" width="122" height="72" fill="#FF922B"/>
    <rect x="634" y="184" width="122" height="72" fill="url(#dotsFine)" opacity=".35"/>
    <!-- lens -->
    <rect x="300" y="330" width="120" height="140" fill="#141414" stroke="#F0F0F0" stroke-width="7"/>
    <rect x="316" y="330" width="16" height="140" fill="#FF922B"/>
    <rect x="352" y="330" width="10" height="140" fill="#F0F0F0" opacity=".4"/>
    <ellipse cx="300" cy="400" rx="26" ry="72" fill="#0A0A0A" stroke="#F0F0F0" stroke-width="7"/>
    <ellipse cx="296" cy="400" rx="12" ry="40" fill="#FF922B"/>
    <!-- record light, dials -->
    <circle cx="700" cy="340" r="12" fill="#FF922B"/>
    <circle cx="470" cy="440" r="26" fill="none" stroke="#F0F0F0" stroke-width="6"/>
    <circle cx="540" cy="440" r="26" fill="none" stroke="#F0F0F0" stroke-width="6"/>
    <rect x="600" y="425" width="110" height="10" fill="#F0F0F0" opacity=".5"/>
    <rect x="600" y="447" width="80" height="10" fill="#F0F0F0" opacity=".5"/>
  </g>


</svg>
