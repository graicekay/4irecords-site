  <!-- 4i Productions lockup, rebuilt from 4i-productions-transparent-light.svg.

       The mark is sized by stroke weight rather than by height: its verticals
       are 100 of its 680 units, so scale 0.2340 puts them on 23.4, the word's
       measured stem. Matching cap heights instead leaves the mark at ~14.5
       and it reads as a second, lighter font. It cannot be thickened with a
       stroke — the counter triangle in the 4 closes and the i stem welds to
       it — so it stands 1.61x the cap height, one weight throughout.

       The box is built from measured ink, not the kit's padding. The word
       path has a 7.71-unit left side bearing before its first glyph, so
       the gap is set from the glyph edge to hold the kit's 0.19 x mark
       height. Height carries 1.32 units past the baseline because the round
       caps overshoot it; without that they crop flat along the bottom.
       A 1-unit bleed all round keeps no edge of the ink flush with the box,
       where antialiasing can shave it. -->
